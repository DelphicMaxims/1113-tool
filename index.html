<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>每日飲食記錄</title>
<style>
  :root{
    --green:#06c755; --green-d:#05a647; --ink:#1f2937; --mute:#6b7280;
    --line:#e5e7eb; --bg:#f4f6f8; --card:#fff; --warn:#b45309; --err:#b91c1c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    padding:16px 16px calc(32px + env(safe-area-inset-bottom));}
  .wrap{max-width:560px;margin:0 auto}
  h1{font-size:22px;margin:4px 0 2px}
  .sub{color:var(--mute);font-size:14px;margin:0 0 14px}
  .banner{background:#fffbeb;border:1px solid #fde68a;color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px;display:none}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .card h2{font-size:16px;margin:0 0 10px;display:flex;align-items:center;gap:8px}
  .card h2 .ico{font-size:20px}
  label{display:block;font-size:13px;color:var(--mute);margin:8px 0 4px}
  input[type=text],input[type=date],input[type=time],input[type=number]{
    width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);
    -webkit-appearance:none;appearance:none;min-height:44px}
  input:focus{outline:2px solid var(--green);outline-offset:0;border-color:var(--green)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;color:var(--ink)}
  .chip:active{background:#ecfdf3;border-color:var(--green)}
  .total{display:flex;justify-content:space-between;align-items:center;font-size:15px;margin:2px 4px 12px}
  .total b{font-size:20px;color:var(--green-d)}
  button.submit{width:100%;border:0;background:var(--green);color:#fff;font-size:17px;font-weight:700;border-radius:12px;padding:14px;min-height:50px;cursor:pointer}
  button.submit:disabled{background:#9ca3af}
  button.submit:active:not(:disabled){background:var(--green-d)}
  .msg{margin-top:12px;padding:12px;border-radius:10px;font-size:14px;display:none;white-space:pre-line}
  .msg.ok{display:block;background:#ecfdf3;border:1px solid #a7f3d0;color:#065f46}
  .msg.err{display:block;background:#fef2f2;border:1px solid #fecaca;color:var(--err)}
  .foot{color:var(--mute);font-size:12px;text-align:center;margin-top:16px}
  .who{font-size:13px;color:var(--mute);margin:0 0 10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🍽️ 每日飲食記錄</h1>
  <p class="sub">記下今天吃了什麼、幾點吃、花多少錢。</p>
  <div class="banner" id="banner"></div>
  <p class="who" id="who"></p>

  <form id="form" autocomplete="off" novalidate>
    <div class="card">
      <label for="date" style="margin-top:0">日期</label>
      <input type="date" id="date" required>
      <div id="nameBox">
        <label for="name">你的名字（選填）</label>
        <input type="text" id="name" maxlength="30" placeholder="例如：Michael">
      </div>
    </div>

    <div class="card" data-meal="breakfast">
      <h2><span class="ico">🥐</span>早餐</h2>
      <label>吃什麼</label>
      <input type="text" name="what" maxlength="60" placeholder="例如：蛋餅、豆漿">
      <div class="row">
        <div><label>幾點吃</label><input type="time" name="time"></div>
        <div><label>花多少（元）</label><input type="number" name="cost" inputmode="numeric" min="0" max="100000" step="1" placeholder="0"></div>
      </div>
    </div>

    <div class="card" data-meal="lunch">
      <h2><span class="ico">🍱</span>中餐</h2>
      <label>吃什麼</label>
      <input type="text" name="what" maxlength="60" placeholder="例如：雞腿便當">
      <div class="row">
        <div><label>幾點吃</label><input type="time" name="time"></div>
        <div><label>花多少（元）</label><input type="number" name="cost" inputmode="numeric" min="0" max="100000" step="1" placeholder="0"></div>
      </div>
    </div>

    <div class="card" data-meal="dinner">
      <h2><span class="ico">🍜</span>晚餐</h2>
      <label>吃什麼</label>
      <input type="text" name="what" maxlength="60" placeholder="例如：牛肉麵">
      <div class="row">
        <div><label>幾點吃</label><input type="time" name="time"></div>
        <div><label>花多少（元）</label><input type="number" name="cost" inputmode="numeric" min="0" max="100000" step="1" placeholder="0"></div>
      </div>
    </div>

    <div class="card">
      <h2><span class="ico">🥤</span>喝什麼飲料</h2>
      <input type="text" id="drink" maxlength="60" placeholder="例如：無糖綠茶、拿鐵">
      <div class="chips" id="chips">
        <span class="chip">水</span><span class="chip">無糖茶</span><span class="chip">咖啡</span>
        <span class="chip">手搖飲</span><span class="chip">牛奶</span><span class="chip">沒喝</span>
      </div>
    </div>

    <div class="total"><span>今天花費合計</span><b id="total">NT$ 0</b></div>
    <button class="submit" id="btn" type="submit">送出記錄</button>
    <div class="msg" id="msg" role="status"></div>
  </form>

  <p class="foot">資料會寫入「每日飲食狀況」試算表</p>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js" async></script>
<script>
/* ============ 設定區：只需要改這兩行 ============ */
// 1) Google Apps Script 部署後的「網頁應用程式網址」（結尾是 /exec）
const SHEET_API_URL = "";
// 2) LINE LIFF ID（格式像 1234567890-AbCdEfGh）。還沒做 LIFF 就留空，頁面照常可用
const LIFF_ID = "";
/* ================================================ */

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
let lineName = "";

// 預設今天（用本機時區）
(function setToday(){
  const d = new Date();
  const p = n => String(n).padStart(2,"0");
  $("#date").value = `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
})();

// 設定檢查
if (!SHEET_API_URL) {
  const b = $("#banner");
  b.style.display = "block";
  b.textContent = "測試模式：尚未設定試算表寫入網址，送出時只會顯示結果，不會存檔。";
}

// 飲料快速選擇
$("#chips").addEventListener("click", e => {
  if (e.target.classList.contains("chip")) {
    $("#drink").value = e.target.textContent;
  }
});

// 合計
function readCost(card){
  const v = parseInt($('[name="cost"]', card).value, 10);
  return Number.isFinite(v) && v > 0 ? v : 0;
}
function updateTotal(){
  const t = $$('[data-meal]').reduce((s,c) => s + readCost(c), 0);
  $("#total").textContent = "NT$ " + t.toLocaleString("en-US");
  return t;
}
$("#form").addEventListener("input", updateTotal);

// LIFF（有設定 LIFF_ID 才啟用）
async function initLiff(){
  if (!LIFF_ID) return;
  let tries = 0;
  while (!window.liff && tries++ < 40) await new Promise(r => setTimeout(r, 100));
  if (!window.liff) return;
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
    const prof = await liff.getProfile();
    lineName = prof.displayName || "";
    $("#who").textContent = "Hi，" + lineName;
    $("#nameBox").style.display = "none";
  } catch (err) {
    console.warn("LIFF 初始化失敗", err);
  }
}
initLiff();

function showMsg(type, text){
  const m = $("#msg");
  m.className = "msg " + type;
  m.textContent = text;
}

function collect(){
  const meals = {};
  $$('[data-meal]').forEach(card => {
    meals[card.dataset.meal] = {
      what: $('[name="what"]', card).value.trim(),
      time: $('[name="time"]', card).value,
      cost: readCost(card)
    };
  });
  return {
    date: $("#date").value,
    name: lineName || $("#name").value.trim(),
    breakfast: meals.breakfast,
    lunch: meals.lunch,
    dinner: meals.dinner,
    drink: $("#drink").value.trim()
  };
}

$("#form").addEventListener("submit", async e => {
  e.preventDefault();
  const data = collect();
  const hasAny = data.breakfast.what || data.lunch.what || data.dinner.what || data.drink;
  if (!data.date) return showMsg("err", "請選日期");
  if (!hasAny) return showMsg("err", "至少填一餐或飲料再送出");

  const btn = $("#btn");
  btn.disabled = true; btn.textContent = "送出中…";
  try {
    if (!SHEET_API_URL) {
      console.log("測試模式，不存檔：", data);
      showMsg("ok", "（測試模式）收到：\n" + JSON.stringify(data, null, 2));
    } else {
      // text/plain 可避開瀏覽器的 CORS 預檢，Apps Script 才收得到
      const res = await fetch(SHEET_API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(data)
      });
      const out = await res.json();
      if (out && out.ok) {
        showMsg("ok", "已記錄 ✅  今天合計 NT$ " + updateTotal().toLocaleString("en-US"));
      } else {
        throw new Error((out && out.error) || "伺服器回傳失敗");
      }
    }
  } catch (err) {
    showMsg("err", "送出失敗：" + err.message + "\n可以稍後再試一次。");
  } finally {
    btn.disabled = false; btn.textContent = "送出記錄";
  }
});
</script>
</body>
</html>
