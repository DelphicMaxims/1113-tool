<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>每日飲食記錄</title>
<style>
  :root{
    --green:#06c755; --green-d:#05a647; --ink:#1f2937; --mute:#6b7280;
    --line:#e5e7eb; --bg:#f4f6f8; --card:#fff; --warn:#b45309; --err:#b91c1c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    padding:16px 16px calc(32px + env(safe-area-inset-bottom));}
  .wrap{max-width:560px;margin:0 auto}
  h1{font-size:22px;margin:4px 0 2px}
  .sub{color:var(--mute);font-size:14px;margin:0 0 14px}
  .banner{background:#fffbeb;border:1px solid #fde68a;color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px;display:none}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
  label:first-child{margin-top:0}
  input[type=text],input[type=date],input[type=time],input[type=number]{
    width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);
    -webkit-appearance:none;appearance:none;min-height:44px}
  input:focus{outline:2px solid var(--green);outline-offset:0;border-color:var(--green)}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

  /* 四個餐別大按鈕 */
  .meals{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .meal{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 2px 10px;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:4px;font-size:15px;font-weight:700;color:var(--ink);min-height:76px}
  .meal .ico{font-size:26px;line-height:1}
  .meal.on{border-color:var(--green);background:#ecfdf3;color:#065f46;box-shadow:0 0 0 3px rgba(6,199,85,.15)}
  .auto{font-size:12px;color:var(--mute);margin:-4px 2px 10px}

  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;color:var(--ink)}
  .chip:active{background:#ecfdf3;border-color:var(--green)}
  button.submit{width:100%;border:0;background:var(--green);color:#fff;font-size:17px;font-weight:700;border-radius:12px;padding:14px;min-height:50px;cursor:pointer}
  button.submit:disabled{background:#9ca3af}
  button.submit:active:not(:disabled){background:var(--green-d)}
  .msg{margin-top:12px;padding:12px;border-radius:10px;font-size:14px;display:none;white-space:pre-line}
  .msg.ok{display:block;background:#ecfdf3;border:1px solid #a7f3d0;color:#065f46}
  .msg.err{display:block;background:#fef2f2;border:1px solid #fecaca;color:var(--err)}
  .foot{color:var(--mute);font-size:12px;text-align:center;margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🍽️ 每日飲食記錄</h1>
  <p class="sub">選一餐，填吃了什麼，送出就記進試算表。</p>
  <div class="banner" id="banner"></div>

  <form id="form" autocomplete="off" novalidate>
    <div class="meals" id="meals" role="radiogroup" aria-label="餐別">
      <button type="button" class="meal" data-meal="早餐" role="radio"><span class="ico">🥐</span>早餐</button>
      <button type="button" class="meal" data-meal="中餐" role="radio"><span class="ico">🍱</span>中餐</button>
      <button type="button" class="meal" data-meal="晚餐" role="radio"><span class="ico">🍜</span>晚餐</button>
      <button type="button" class="meal" data-meal="其他" role="radio"><span class="ico">🍰</span>其他</button>
    </div>
    <p class="auto" id="auto"></p>

    <div class="card">
      <label for="what">吃什麼</label>
      <input type="text" id="what" maxlength="60" placeholder="例如：蛋餅、雞腿便當、牛肉麵">
      <div class="row">
        <div><label for="time">幾點吃</label><input type="time" id="time"></div>
        <div><label for="cost">花多少（元）</label><input type="number" id="cost" inputmode="numeric" min="0" max="100000" step="1" placeholder="0"></div>
      </div>
    </div>

    <div class="card">
      <label for="drink">喝什麼飲料</label>
      <input type="text" id="drink" maxlength="60" placeholder="例如：無糖綠茶、拿鐵">
      <div class="chips" id="chips">
        <span class="chip">水</span><span class="chip">無糖茶</span><span class="chip">咖啡</span>
        <span class="chip">手搖飲</span><span class="chip">牛奶</span><span class="chip">沒喝</span>
      </div>
    </div>

    <div class="card">
      <div class="row">
        <div><label for="date">日期</label><input type="date" id="date" required></div>
        <div><label for="name">名字</label><input type="text" id="name" maxlength="30" value="Michael"></div>
      </div>
    </div>

    <button class="submit" id="btn" type="submit">送出記錄</button>
    <div class="msg" id="msg" role="status"></div>
  </form>

  <p class="foot">資料會寫入「每日飲食狀況」試算表</p>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js" async></script>
<script>
/* ============ 設定區：只需要改這兩行 ============ */
// 1) Google Apps Script 部署後的「網頁應用程式網址」（結尾是 /exec）
const SHEET_API_URL = "https://script.google.com/macros/s/AKfycbxcGfc7ePgOOFP12slWnc63aK1thr5PdaUWT_uPsB2kYKxvwpCzZ8nF4dMxpIkjzEWx/exec";
// 2) LINE LIFF ID（格式像 1234567890-AbCdEfGh）。還沒做 LIFF 就留空，頁面照常可用
const LIFF_ID = "2012586717-l1FQfKmA";
/* ================================================ */

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const p2 = n => String(n).padStart(2,"0");

// 設定檢查
if (!SHEET_API_URL) {
  const b = $("#banner");
  b.style.display = "block";
  b.textContent = "測試模式：尚未設定試算表寫入網址，送出時只會顯示結果，不會存檔。";
}

// ---- 日期、時間自動帶入「現在」（用裝置本機時區） ----
function setNow(){
  const d = new Date();
  $("#date").value = `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
  $("#time").value = `${p2(d.getHours())}:${p2(d.getMinutes())}`;
}
let timeTouched = false;
$("#time").addEventListener("input", () => { timeTouched = true; });

// ---- 依時間自動選餐別 ----
//  05:00–10:29 早餐 ／ 10:30–14:29 中餐 ／ 16:30–20:59 晚餐 ／ 其餘 其他（下午茶、宵夜…）
function guessMeal(d = new Date()){
  const m = d.getHours()*60 + d.getMinutes();
  if (m >= 300  && m < 630)  return "早餐";
  if (m >= 630  && m < 870)  return "中餐";
  if (m >= 990  && m < 1260) return "晚餐";
  return "其他";
}
let meal = "";
let manualPick = false;
function selectMeal(name, byUser){
  meal = name;
  if (byUser) manualPick = true;
  $$(".meal").forEach(b => {
    const on = b.dataset.meal === name;
    b.classList.toggle("on", on);
    b.setAttribute("aria-checked", on ? "true" : "false");
  });
  $("#auto").textContent = byUser ? "已手動選擇：" + name : "依現在時間自動選：" + name + "（可以改按其他）";
}
$("#meals").addEventListener("click", e => {
  const b = e.target.closest(".meal");
  if (b) selectMeal(b.dataset.meal, true);
});

// 飲料快速選擇
$("#chips").addEventListener("click", e => {
  if (e.target.classList.contains("chip")) $("#drink").value = e.target.textContent;
});

// 開著頁面放很久再回來：沒手動改過就重新抓時間與餐別
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") {
    setNow0();
  }
});
function setNow0(){
  const d = new Date();
  $("#date").value = `${d.getFullYear()}-${p2(d.getMonth()+1)}-${p2(d.getDate())}`;
  if (!timeTouched) $("#time").value = `${p2(d.getHours())}:${p2(d.getMinutes())}`;
  if (!manualPick) selectMeal(guessMeal(d), false);
}
setNow();
selectMeal(guessMeal(), false);

// LIFF（有設定 LIFF_ID 才啟用）：只用來確認是 LINE 內開啟，名字預設仍是 Michael，可自行修改
async function initLiff(){
  if (!LIFF_ID) return;
  let tries = 0;
  while (!window.liff && tries++ < 40) await new Promise(r => setTimeout(r, 100));
  if (!window.liff) return;
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login(); return; }
  } catch (err) {
    console.warn("LIFF 初始化失敗", err);
  }
}
initLiff();

function showMsg(type, text){
  const m = $("#msg");
  m.className = "msg " + type;
  m.textContent = text;
}

function collect(){
  const cv = parseInt($("#cost").value, 10);
  return {
    date: $("#date").value,
    name: $("#name").value.trim(),
    meal: meal,
    what: $("#what").value.trim(),
    time: $("#time").value,
    cost: Number.isFinite(cv) && cv > 0 ? cv : 0,
    drink: $("#drink").value.trim()
  };
}

$("#form").addEventListener("submit", async e => {
  e.preventDefault();
  const data = collect();
  if (!data.date) return showMsg("err", "請選日期");
  if (!data.meal) return showMsg("err", "請先選早餐／中餐／晚餐／其他");
  if (!data.what && !data.drink) return showMsg("err", "「吃什麼」或「飲料」至少填一個再送出");

  const btn = $("#btn");
  btn.disabled = true; btn.textContent = "送出中…";
  try {
    if (!SHEET_API_URL) {
      console.log("測試模式，不存檔：", data);
      showMsg("ok", "（測試模式）收到：\n" + JSON.stringify(data, null, 2));
    } else {
      // text/plain 可避開瀏覽器的 CORS 預檢，Apps Script 才收得到
      const res = await fetch(SHEET_API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(data)
      });
      const out = await res.json();
      if (out && out.ok) {
        showMsg("ok", "已記錄 ✅  " + data.meal + (data.what ? "：" + data.what : "") + (data.cost ? "  NT$ " + data.cost : "") + "\n想再記下一筆，直接改內容再送出。");
        // 清掉這筆的內容，保留日期、名字
        $("#what").value = ""; $("#cost").value = ""; $("#drink").value = "";
        timeTouched = false; manualPick = false;
        setNow0();
      } else {
        throw new Error((out && out.error) || "伺服器回傳失敗");
      }
    }
  } catch (err) {
    showMsg("err", "送出失敗：" + err.message + "\n可以稍後再試一次。");
  } finally {
    btn.disabled = false; btn.textContent = "送出記錄";
  }
});
</script>
</body>
</html>
