<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 全球核彈數量戰略態勢圖 // IMF TERMINAL</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
  <style>
    :root {
      --bg-void: #07090d;
      --bg-panel: rgba(12, 16, 23, 0.86);
      --border-hud: rgba(217, 155, 67, 0.28);
      --accent-amber: #f59e0b;
      --accent-amber-glow: rgba(245, 158, 11, 0.35);
      --accent-cyan: #38bdf8;
      --accent-red: #ef4444;
      --text-primary: #f3ede2;
      --text-muted: #9ca3af;
      --font-sans: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', 'Courier New', monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-void);
      color: var(--text-primary);
      font-family: var(--font-sans);
      user-select: none;
    }

    /* 背景科技網格與掃描線 */
    .hud-backdrop {
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 50% 45%, rgba(30, 24, 18, 0.55) 0%, rgba(7, 9, 13, 0.96) 75%),
        linear-gradient(rgba(245, 158, 11, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(245, 158, 11, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 40px 40px, 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    .scanlines {
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0) 0px,
        rgba(255, 255, 255, 0) 2px,
        rgba(0, 0, 0, 0.16) 3px,
        rgba(0, 0, 0, 0.16) 4px
      );
      pointer-events: none;
      z-index: 50;
      opacity: 0.45;
    }

    /* 頂部 IMF 戰情列 */
    header.hud-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 60px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(180deg, rgba(10, 13, 19, 0.95) 0%, rgba(10, 13, 19, 0.72) 100%);
      border-bottom: 1px solid var(--border-hud);
      backdrop-filter: blur(8px);
      z-index: 20;
    }

    .brand-block {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .imf-badge {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.16em;
      color: #07090d;
      background: var(--accent-amber);
      padding: 4px 8px;
      border-radius: 2px;
      box-shadow: 0 0 12px var(--accent-amber-glow);
    }

    .title-group h1 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--text-primary);
    }

    .title-group .subtitle {
      font-family: var(--font-mono);
      font-size: 10px;
      letter-spacing: 0.15em;
      color: var(--accent-amber);
      opacity: 0.85;
      margin-top: 2px;
    }

    .telemetry-bar {
      display: flex;
      align-items: center;
      gap: 24px;
      font-family: var(--font-mono);
      font-size: 12px;
    }

    .telemetry-item {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .telemetry-label {
      font-size: 9px;
      letter-spacing: 0.12em;
      color: var(--text-muted);
    }

    .telemetry-value {
      font-weight: 600;
      color: var(--text-primary);
      margin-top: 1px;
    }

    .telemetry-value.highlight {
      color: var(--accent-amber);
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 10px;
      border: 1px solid rgba(239, 68, 68, 0.4);
      background: rgba(239, 68, 68, 0.08);
      border-radius: 2px;
      font-size: 11px;
      letter-spacing: 0.1em;
      color: #fca5a5;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent-red);
      box-shadow: 0 0 8px var(--accent-red);
      animation: pulse 1.6s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.35; transform: scale(0.8); }
    }

    /* 地圖容器 */
    #map-container {
      position: fixed;
      inset: 60px 0 0 0;
      z-index: 5;
      cursor: grab;
    }

    #map-container:active {
      cursor: grabbing;
    }

    svg#world-map {
      width: 100%;
      height: 100%;
      display: block;
    }

    .graticule {
      fill: none;
      stroke: rgba(217, 155, 67, 0.09);
      stroke-width: 0.6px;
      stroke-dasharray: 2 3;
    }

    .sphere-outline {
      fill: rgba(8, 11, 16, 0.55);
      stroke: rgba(245, 158, 11, 0.25);
      stroke-width: 1px;
    }

    .country {
      stroke: #4f3a27;
      stroke-width: 0.65px;
      transition: fill 0.18s ease, stroke 0.15s ease, filter 0.15s ease;
    }

    .country:hover,
    .country.active {
      stroke: #fbbf24;
      stroke-width: 1.5px;
      filter: drop-shadow(0 0 8px rgba(245, 158, 11, 0.55));
    }

    /* 四角戰術框裝飾 */
    .hud-corner {
      position: fixed;
      width: 22px;
      height: 22px;
      border-color: rgba(245, 158, 11, 0.55);
      border-style: solid;
      pointer-events: none;
      z-index: 15;
    }
    .corner-tl { top: 74px; left: 16px; border-width: 2px 0 0 2px; }
    .corner-tr { top: 74px; right: 16px; border-width: 2px 2px 0 0; }
    .corner-bl { bottom: 16px; left: 16px; border-width: 0 0 2px 2px; }
    .corner-br { bottom: 16px; right: 16px; border-width: 0 2px 2px 0; }

    /* 左下角控制與資料說明 */
    .hud-controls {
      position: fixed;
      bottom: 26px;
      left: 26px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .zoom-group {
      display: flex;
      gap: 6px;
    }

    .hud-btn {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      background: var(--bg-panel);
      border: 1px solid var(--border-hud);
      padding: 7px 12px;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.15s ease;
    }

    .hud-btn:hover {
      border-color: var(--accent-amber);
      color: var(--accent-amber);
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.25);
    }

    .meta-note {
      font-family: var(--font-mono);
      font-size: 10px;
      line-height: 1.5;
      color: var(--text-muted);
      background: var(--bg-panel);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-left: 2px solid var(--accent-amber);
      padding: 8px 12px;
      backdrop-filter: blur(8px);
      max-width: 300px;
    }

    /* 右下角圖例 */
    .legend-panel {
      position: fixed;
      bottom: 26px;
      right: 26px;
      z-index: 20;
      width: 248px;
      background: var(--bg-panel);
      border: 1px solid var(--border-hud);
      backdrop-filter: blur(10px);
      padding: 14px 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.65);
    }

    .legend-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(245, 158, 11, 0.2);
      padding-bottom: 8px;
      margin-bottom: 10px;
    }

    .legend-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--accent-amber);
    }

    .legend-unit {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--text-muted);
    }

    .legend-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      padding: 3px 5px;
      border-radius: 2px;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .legend-item:hover {
      background: rgba(245, 158, 11, 0.1);
    }

    .legend-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .legend-swatch {
      width: 18px;
      height: 12px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      flex-shrink: 0;
    }

    .legend-range {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--text-primary);
    }

    .legend-desc {
      font-size: 10px;
      color: var(--text-muted);
    }

    /* 滑鼠懸停資訊框 Tooltip */
    .hud-tooltip {
      position: fixed;
      pointer-events: none;
      z-index: 40;
      min-width: 215px;
      background: rgba(10, 14, 21, 0.94);
      border: 1px solid var(--accent-amber);
      box-shadow: 0 0 22px rgba(0, 0, 0, 0.8), 0 0 12px rgba(245, 158, 11, 0.22);
      padding: 11px 14px;
      backdrop-filter: blur(10px);
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.12s ease, transform 0.12s ease;
    }

    .hud-tooltip.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .tooltip-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid rgba(245, 158, 11, 0.22);
      padding-bottom: 6px;
      margin-bottom: 8px;
    }

    .tooltip-country {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: 0.04em;
    }

    .tooltip-tag {
      font-family: var(--font-mono);
      font-size: 9px;
      padding: 2px 5px;
      border-radius: 2px;
      letter-spacing: 0.08em;
    }

    .tag-armed {
      background: rgba(239, 68, 68, 0.18);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.45);
    }

    .tag-none {
      background: rgba(156, 163, 175, 0.12);
      color: #9ca3af;
      border: 1px solid rgba(156, 163, 175, 0.25);
    }

    .tooltip-metric {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }

    .tooltip-label {
      font-size: 11px;
      color: var(--text-muted);
    }

    .tooltip-value {
      font-family: var(--font-mono);
      font-size: 17px;
      font-weight: 700;
      color: var(--accent-amber);
    }

    .tooltip-value.zero {
      color: #d6c3a5;
      font-size: 14px;
    }

    /* 載入畫面 */
    #loading-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg-void);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 100;
      font-family: var(--font-mono);
      transition: opacity 0.4s ease;
    }

    .loader-bar {
      width: 240px;
      height: 3px;
      background: rgba(245, 158, 11, 0.15);
      overflow: hidden;
      position: relative;
    }

    .loader-bar::after {
      content: "";
      position: absolute;
      left: -40%;
      width: 40%;
      height: 100%;
      background: var(--accent-amber);
      box-shadow: 0 0 10px var(--accent-amber);
      animation: scan 1.1s infinite linear;
    }

    @keyframes scan {
      0% { left: -40%; }
      100% { left: 100%; }
    }

    .loader-text {
      font-size: 12px;
      letter-spacing: 0.18em;
      color: var(--accent-amber);
    }

    @media (max-width: 768px) {
      .telemetry-bar { display: none; }
      .meta-note { display: none; }
      .legend-panel {
        width: 205px;
        bottom: 16px;
        right: 16px;
        padding: 10px 12px;
      }
      .hud-controls {
        bottom: 16px;
        left: 16px;
      }
    }
  </style>
</head>

      "540": "新喀里多尼亞", "554": "紐西蘭", "558": "尼加拉瓜", "562": "尼日", "566": "奈及利亞",
      "578": "挪威", "512": "阿曼", "586": "巴基斯坦", "275": "巴勒斯坦", "591": "巴拿馬",
      "598": "巴布亞紐幾內亞", "600": "巴拉圭", "604": "秘魯", "608": "菲律賓", "616": "波蘭",
      "620": "葡萄牙", "630": "波多黎各", "634": "卡達", "642": "羅馬尼亞", "643": "俄羅斯",
      "646": "盧安達", "682": "沙烏地阿拉伯", "686": "塞內加爾", "688": "塞爾維亞", "694": "獅子山",
      "703": "斯洛伐克", "705": "斯洛維尼亞", "090": "索羅門群島", "706": "索馬利亞", "710": "南非",
      "728": "南蘇丹", "724": "西班牙", "144": "斯里蘭卡", "729": "蘇丹", "740": "蘇利南",
      "752": "瑞典", "756": "瑞士", "760": "敘利亞", "158": "台灣", "762": "塔吉克",
      "834": "坦尚尼亞", "764": "泰國", "626": "東帝汶", "768": "多哥", "780": "千里達及托巴哥",
      "788": "突尼西亞", "792": "土耳其", "795": "土庫曼", "800": "烏干達", "804": "烏克蘭",
      "784": "阿拉伯聯合大公國", "826": "英國", "840": "美國", "858": "烏拉圭", "860": "烏茲別克",
      "548": "萬那杜", "862": "委內瑞拉", "704": "越南", "732": "西撒哈拉", "887": "葉門",
      "894": "尚比亞", "716": "辛巴威", "260": "法屬南部領地"
    };

    const COUNTRY_ZH_BY_NAME = {
      "Somaliland": "索馬利蘭",
      "Kosovo": "科索沃",
      "N. Cyprus": "北賽普勒斯",
      "W. Sahara": "西撒哈拉",
      "Dem. Rep. Congo": "剛果民主共和國",
      "Dominican Rep.": "多明尼加",
      "Falkland Is.": "福克蘭群島",
      "Fr. S. Antarctic Lands": "法屬南部領地",
      "Central African Rep.": "中非共和國",
      "Eq. Guinea": "赤道幾內亞",
      "eSwatini": "史瓦帝尼",
      "Solomon Is.": "索羅門群島",
      "S. Sudan": "南蘇丹",
      "Bosnia and Herz.": "波士尼亞與赫塞哥維納",
      "Macedonia": "北馬其頓",
      "United States of America": "美國",
      "Russia": "俄羅斯",
      "Taiwan": "台灣"
    };

    function getChineseName(feature) {
      const id = feature.id != null ? String(feature.id).padStart(3, "0") : "";
      if (COUNTRY_ZH_BY_ID[id]) return COUNTRY_ZH_BY_ID[id];
      const enName = feature.properties && feature.properties.name ? feature.properties.name : "未知地區";
      return COUNTRY_ZH_BY_NAME[enName] || enName;
    }

    function getWarheadCount(feature) {
      const id = feature.id != null ? String(feature.id).padStart(3, "0") : "";
      return NUCLEAR_DATA_2026[id] || 0;
    }

    // 4. UTC 即時時鐘
    function updateClock() {
      const now = new Date();
      const pad = n => String(n).padStart(2, "0");
      document.getElementById("utc-clock").textContent =
        `${pad(now.getUTCHours())}:${pad(now.getUTCMinutes())}:${pad(now.getUTCSeconds())} Z`;
    }
    updateClock();
    setInterval(updateClock, 1000);

    // 5. 渲染右下角圖例
    const legendList = document.getElementById("legend-list");
    TIERS.forEach(tier => {
      const item = document.createElement("div");
      item.className = "legend-item";
      item.innerHTML = `
        <div class="legend-left">
          <span class="legend-swatch" style="background:${tier.color};"></span>
          <span class="legend-range">${tier.range}</span>
        </div>
        <span class="legend-desc">${tier.desc}</span>
      `;

      item.addEventListener("mouseenter", () => {
        d3.selectAll(".country").style("opacity", d => {
          const c = getWarheadCount(d);
          return getTier(c).id === tier.id ? 1 : 0.22;
        });
      });

      item.addEventListener("mouseleave", () => {
        d3.selectAll(".country").style("opacity", 1);
      });

      legendList.appendChild(item);
    });

    // 6. 建立 D3 世界地圖
    const container = document.getElementById("map-container");
    const svg = d3.select("#world-map");
    const mapLayer = svg.append("g");
    const tooltip = document.getElementById("tooltip");
    const ttCountry = document.getElementById("tt-country");
    const ttTag = document.getElementById("tt-tag");
    const ttCount = document.getElementById("tt-count");

    let width = container.clientWidth;
    let height = container.clientHeight;

    const projection = d3.geoNaturalEarth1();
    const path = d3.geoPath(projection);
    const graticule = d3.geoGraticule();

    const zoom = d3.zoom()
      .scaleExtent([1, 8])
      .on("zoom", (event) => {
        mapLayer.attr("transform", event.transform);
      });

    svg.call(zoom);

    document.getElementById("btn-zoom-in").addEventListener("click", () => {
      svg.transition().duration(300).call(zoom.scaleBy, 1.45);
    });

    document.getElementById("btn-zoom-out").addEventListener("click", () => {
      svg.transition().duration(300).call(zoom.scaleBy, 0.7);
    });

    document.getElementById("btn-reset").addEventListener("click", () => {
      svg.transition().duration(450).call(zoom.transform, d3.zoomIdentity);
    });

    function positionTooltip(event) {
      const offset = 16;
      const ttRect = tooltip.getBoundingClientRect();
      let x = event.clientX + offset;
      let y = event.clientY + offset;

      if (x + ttRect.width > window.innerWidth - 12) {
        x = event.clientX - ttRect.width - offset;
      }
      if (y + ttRect.height > window.innerHeight - 12) {
        y = event.clientY - ttRect.height - offset;
      }

      tooltip.style.left = `${x}px`;
      tooltip.style.top = `${y}px`;
    }

    // 載入 TopoJSON 圖資
    fetch("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json")
      .then(res => {
        if (!res.ok) throw new Error("無法載入世界地圖圖資");
        return res.json();
      })
      .then(world => {
        // 過濾南極洲 (010) 以獲得更佳的戰略視圖比例
        const countries = topojson.feature(world, world.objects.countries).features
          .filter(d => String(d.id).padStart(3, "0") !== "010");

        const geoCollection = { type: "FeatureCollection", features: countries };

        function fitProjection() {
          width = container.clientWidth;
          height = container.clientHeight;
          svg.attr("viewBox", `0 0 ${width} ${height}`);
          projection.fitExtent([[36, 20], [width - 36, height - 28]], geoCollection);
        }

        fitProjection();

        // 經緯網格與地球外框
        const spherePath = mapLayer.append("path")
          .datum({ type: "Sphere" })
          .attr("class", "sphere-outline")
          .attr("d", path);

        const gratPath = mapLayer.append("path")
          .datum(graticule())
          .attr("class", "graticule")
          .attr("d", path);

        // 國家多邊形
        const countryPaths = mapLayer.selectAll("path.country")
          .data(countries)
          .enter()
          .append("path")
          .attr("class", "country")
          .attr("d", path)
          .attr("fill", d => getTier(getWarheadCount(d)).color)
          .on("mouseenter", function (event, d) {
            const count = getWarheadCount(d);
            const nameZh = getChineseName(d);

            d3.select(this).raise().classed("active", true);

            ttCountry.textContent = nameZh;
            if (count > 0) {
              ttTag.textContent = "擁核國家";
              ttTag.className = "tooltip-tag tag-armed";
              ttCount.textContent = `${count.toLocaleString()} 枚`;
              ttCount.className = "tooltip-value";
            } else {
              ttTag.textContent = "無核武";
              ttTag.className = "tooltip-tag tag-none";
              ttCount.textContent = "0 枚";
              ttCount.className = "tooltip-value zero";
            }

            tooltip.classList.add("visible");
            positionTooltip(event);
          })
          .on("mousemove", function (event) {
            positionTooltip(event);
          })
          .on("mouseleave", function () {
            d3.select(this).classed("active", false);
            tooltip.classList.remove("visible");
          });

        // 視窗大小調整自適應
        window.addEventListener("resize", () => {
          fitProjection();
          spherePath.attr("d", path);
          gratPath.attr("d", path);
          countryPaths.attr("d", path);
        });

        // 隱藏載入遮罩
        const loader = document.getElementById("loading-overlay");
        loader.style.opacity = "0";
        setTimeout(() => loader.remove(), 400);
      })
      .catch(err => {
        document.querySelector(".loader-text").textContent = "UPLINK FAILED // 請檢查網路連線後重新整理";
        document.querySelector(".loader-text").style.color = "#ef4444";
        console.error(err);
      });
  </script>
</body>
</html>
